name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Tests (offline)
        run: python -m pytest -v
      - name: Example check (expects exit 2 for the stale example)
        run: |
          set +e
          python -m routine_heartbeat check --registry examples/expected.json --dir examples/heartbeats --now 2026-03-05T10:20:00-05:00
          rc=$?
          test "$rc" -eq 2
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck examples/*.sh
